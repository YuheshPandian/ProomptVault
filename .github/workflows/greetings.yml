name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Welcome to the project. Thank you for opening your first issue! We're excited to have you on board and appreciate your contribution to our project. To ensure the issue is addressed effectively, please check out our contributing guidelines. If you have any questions or need assistance, feel free to ask. We're here to help!"
        pr-message: "🎉 Thank you for your first contribution. We really appreciate your effort in making our project better. Your pull request is now under review, and we'll get back to you soon with feedback. In the meantime, make sure you've read our Contributing.md to ensure everything is in order. Your help and dedication are what keep this project thriving. Welcome to the community! 🌟."
